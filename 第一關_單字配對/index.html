<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Savanna Word Hunt</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="game-shell">
    <a class="map-return" href="../大冒險地圖/index.html">← BACK TO SAFARI MAP <small>← 回到大地圖</small></a>
    <img class="decor compass" src="assets/images/safari-decorations.png" alt="探險羅盤"><img class="decor footprints" src="assets/images/safari-decorations.png" alt="動物足跡">
    <header class="topbar"><div class="round-info"><span id="roundNo">ROUND 1 / 3</span><strong id="roundName">SAVANNA BASE CAMP</strong></div><div class="game-title"><h1>Savanna Word Hunt</h1><p>Safari Vocabulary Expedition</p></div><div class="stats"><div id="timer" aria-live="polite">TIME : 45</div><div id="matched">MATCHED : 0 / 8</div></div></header>
    <section class="play-area"><div id="trailLabel" class="trail-label">EXPEDITION START</div><div id="grid" class="card-grid" aria-label="單字配對卡片"></div></section>
    <div id="toast" class="toast" role="status"></div>
    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="journal-modal"><div class="stamp">SAFARI<br>STAMP</div><h2 id="overlayTitle">Welcome, Explorer!</h2><p id="overlayText">Find each English word and its Traditional Chinese meaning.</p><button id="overlayButton">開始探險</button></div></div>
  </main><script src="vocabulary-data.js"></script><script src="game.js"></script>
</body></html>
