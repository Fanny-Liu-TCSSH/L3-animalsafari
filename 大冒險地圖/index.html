@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Patrick+Hand&display=swap');
:root{--ink:#263949;--brown:#5a3c25;--paper:#fff9e9;--sand:#ead29b;--sage:#708253;--orange:#bd7139;--good:#607d52;--bad:#c46e62}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'Noto Sans TC',sans-serif;background:#d9bd7d}.map{min-height:100vh;padding:clamp(12px,2vw,28px);background:linear-gradient(#fffbefa9,#fff6df9c),url('../第三關_句型任務/assets/images/ranger-station-background.png') center/cover fixed}.top{max-width:1220px;margin:auto;padding:16px 22px;display:grid;grid-template-columns:1fr auto;align-items:center;border:2px solid #754e2e;border-radius:18px;background:#fff7e7df;box-shadow:0 5px 0 #8a623a3b}.title h1{margin:0;color:#514129;font:clamp(2rem,4vw,3.35rem)/.9 'Patrick Hand',cursive;letter-spacing:.03em}.title p{margin:8px 0 0;font-size:clamp(.76rem,1.4vw,.98rem);color:#705c44}.title small{display:block;margin-top:3px;color:#a15d31}.button{border:2px solid #4c643b;border-radius:10px;padding:9px 15px;background:#688254;color:#fffdf0;box-shadow:0 3px 0 #405534;font:900 .88rem 'Noto Sans TC';cursor:pointer}.button.paper{border-color:#896442;background:#f8edd0;color:#62482f;box-shadow:0 3px 0 #a78159}.passport{width:min(1140px,96vw);margin:14px auto;padding:11px 18px;border:2px solid #795831;border-radius:14px;background:#fff8e6e8;box-shadow:0 5px 13px #493b2845;display:flex;align-items:center;justify-content:space-between;gap:12px}.passport h2{margin:0;color:#8d5935;font:1.45rem 'Patrick Hand',cursive;letter-spacing:.08em}.slots{display:flex;gap:9px;flex-wrap:wrap}.mini-badge{width:80px;min-height:44px;display:grid;place-items:center;text-align:center;padding:4px;border:2px dashed #9a8568;border-radius:50%;background:#e5ddd0;color:#8a7b65;font: .75rem/.9 'Patrick Hand',cursive}.mini-badge.earned{border-style:double;border-color:#5e8047;background:#e9f1d6;color:#496638;box-shadow:0 2px 0 #78915e}.mini-badge.earned:after{content:'✓';font-size:1rem}.counter{font:1.6rem 'Patrick Hand',cursive;color:#4c593c}.route{width:min(1160px,96vw);margin:auto;position:relative;padding:20px clamp(10px,3vw,42px) 30px;border:3px solid #795831;border-radius:22px;background:linear-gradient(105deg,#e8cf95dc,#fff8e2ec);box-shadow:0 10px 23px #493b285c;overflow:hidden}.route:before{content:'';position:absolute;inset:12px;border:1px dashed #a47b4d;border-radius:12px;pointer-events:none}.route-heading{position:relative;margin:0 0 6px;text-align:center;color:#5c432b;font:clamp(1.7rem,3.5vw,2.65rem) 'Patrick Hand',cursive}.route-sub{position:relative;margin:0 0 18px;text-align:center;color:#7a6248;font-size:.88rem}.trail{position:absolute;z-index:1;left:12%;right:12%;top:49%;height:62px;border-top:5px dotted #8a623a;transform:rotate(-2deg);opacity:.8}.stop-row{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,3vw,38px);align-items:start}.landmark{min-height:270px;position:relative;padding:19px 15px 15px;text-align:center;border:3px solid #795831;border-radius:17px;background:#fff9e9e8;box-shadow:0 5px 0 #8a623a49,0 10px 18px #493b2838}.landmark:nth-child(2){transform:translateY(35px)}.landmark:nth-child(3){transform:translateY(4px)}.icon{width:78px;height:78px;margin:0 auto 5px;display:grid;place-items:center;border:3px double #8d6037;border-radius:50%;background:#ead29b;color:#5a3c25;font:2.5rem 'Patrick Hand',cursive}.landmark h3{margin:3px 0;color:#514129;font:1.65rem/1 'Patrick Hand',cursive}.landmark p{margin:5px 0;color:#7b6043;font-size:.8rem}.landmark .zh{font-weight:700;color:#75604a}.status{display:inline-block;margin:7px 0;padding:3px 9px;border:1px dashed #9b7851;border-radius:5px;color:#8d5935;font:.93rem 'Patrick Hand',cursive}.landmark.completed{background:#f0f5df}.landmark.completed .status{border-color:#5c8149;color:#496d3b}.landmark.locked{filter:sepia(.35) saturate(.55)}.landmark.locked:after{content:'LOCKED';position:absolute;right:12px;top:11px;border:2px solid #8b6d4a;border-radius:6px;padding:3px 7px;color:#775c3d;font:1rem 'Patrick Hand',cursive;transform:rotate(8deg)}.stamp{position:absolute;right:9px;top:6px;border:3px double #5a7b42;border-radius:50%;padding:7px 5px;color:#4d713a;font:1rem/.85 'Patrick Hand',cursive;transform:rotate(13deg);opacity:.9}.gate-wrap{position:relative;z-index:2;margin:70px auto 0;width:min(520px,92%);text-align:center}.gate{min-height:190px;padding:22px;border:5px solid #60452b;border-radius:90px 90px 12px 12px;background:linear-gradient(90deg,#6a482d,#9a6b3a 50%,#6a482d);box-shadow:inset 0 0 0 4px #c29460,0 8px 15px #493b2862;color:#fff1c8;cursor:pointer}.gate:hover{transform:translateY(-2px)}.gate h2{margin:6px 0 3px;font:2.25rem/1 'Patrick Hand',cursive}.gate p{margin:0;font-size:.85rem}.gate-slots{display:flex;justify-content:center;gap:7px;margin-top:14px}.gate-slots span{width:72px;padding:7px 3px;border:2px dashed #f2d79b;border-radius:50%;font:.72rem/.9 'Patrick Hand',cursive}.map-toast{position:fixed;z-index:20;top:112px;left:50%;transform:translate(-50%,-15px);padding:9px 17px;border:2px solid #526a3e;border-radius:10px;background:#f4f7e7ef;color:#405d35;font-weight:900;box-shadow:0 4px 12px #463b2b3d;opacity:0;pointer-events:none;transition:.22s}.map-toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:16px;background:#2430377d;backdrop-filter:blur(2px)}.hidden{display:none!important}.modal-card{width:min(94vw,720px);position:relative;padding:35px 25px 24px;text-align:center;border:3px solid #795831;border-radius:18px;background:linear-gradient(120deg,#fff8df,#f1d89d);box-shadow:0 10px 35px #1e272c70}.modal-card:before{content:'';position:absolute;inset:10px;border:1px dashed #966d3e;border-radius:11px;pointer-events:none}.modal-card>*{position:relative}.modal-card h2{margin:0;color:#514129;font:2.6rem/1 'Patrick Hand',cursive}.modal-card p{margin:9px auto;max-width:540px}.slot-row,.backpack{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.gate-slot{width:130px;min-height:100px;display:grid;place-items:center;border:3px dashed #9b7851;border-radius:13px;background:#fffdf5b8;color:#7d6b55;font:.9rem/.95 'Patrick Hand',cursive;cursor:pointer}.gate-slot.filled{border-color:#5d8546;background:#eaf2d8;animation:pop .45s}.gate-slot.wrong{border-color:#c46e62;background:#fff0ed;animation:shake .45s}.badge{width:128px;min-height:76px;display:grid;place-items:center;padding:9px;border:3px double #758850;border-radius:50%;background:#e9f1d6;color:#496638;box-shadow:0 3px 0 #78915e;font:1.05rem/.95 'Patrick Hand',cursive;cursor:grab;touch-action:none}.badge.selected{outline:4px solid #e6bb68;transform:translateY(-3px)}.badge.placed{opacity:.45;cursor:default}.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.complete .modal-card{background:linear-gradient(120deg,#fff9e2,#e8d08d)}.complete .modal-card:after{content:'COMPLETED';position:absolute;right:24px;top:20px;border:4px double #5a7b42;border-radius:50%;padding:12px 7px;color:#4d713a;font:1.45rem/.85 'Patrick Hand',cursive;transform:rotate(12deg)}.complete-badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.time{margin:12px 0;color:#8d5935;font:1.45rem 'Patrick Hand',cursive}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes pop{50%{transform:scale(1.08)}}@media(max-width:720px){.top{grid-template-columns:1fr;gap:12px}.top .button{justify-self:start}.passport{align-items:flex-start;flex-direction:column}.stop-row{display:flex;flex-direction:column;align-items:stretch}.trail{left:50%;top:14%;bottom:19%;right:auto;height:auto;border-top:0;border-left:5px dotted #8a623a;transform:none}.landmark,.landmark:nth-child(2),.landmark:nth-child(3){transform:none;margin-left:15px}.gate-wrap{margin-top:30px}.gate{min-height:160px}.mini-badge{width:69px}.route{padding:15px 12px 22px}}
</style></head><body><main class="map"><header class="top"><div class="title"><h1>SAFARI ENGLISH EXPEDITION</h1><p>Complete all 3 missions and unlock the final gate.</p><small>完成三個英語任務，取得三枚探險徽章，打開最終大門。</small></div><button id="clearProgress" class="button paper">CLEAR PROGRESS<br>清除進度</button></header><section class="passport"><h2>EXPEDITION PROGRESS</h2><div id="miniSlots" class="slots"></div><div id="count" class="counter">0 / 3 Badges</div></section><section class="route"><h2 class="route-heading">SAFARI EXPEDITION MAP</h2><p class="route-sub">START CAMP · Follow the hand-drawn trail to the final gate.</p><div class="trail"></div><div class="stop-row" id="stops"></div><div class="gate-wrap"><button id="gate" class="gate" type="button"><h2>FINAL EXPEDITION GATE</h2><p id="gateCount">BADGES COLLECTED: 0 / 3</p><div class="gate-slots"><span>VOCABULARY</span><span>READING</span><span>GRAMMAR</span></div></button></div></section></main><div id="toast" class="map-toast"></div><div id="modal" class="modal hidden"></div><script>
const KEYS={v:'safariExpedition.vocabularyComplete',r:'safariExpedition.readingComplete',g:'safariExpedition.grammarComplete',start:'adventure_start',gate:'safariExpedition.gateOpened'};const missions=[{id:'v',title:'SAVANNA WORD HUNT',sub:'Vocabulary Expedition',zh:'草原詞彙獵蹤',icon:'Aa',badge:'VOCABULARY BADGE',path:'../第一關_單字配對/index.html'},{id:'r',title:'SAFARI FIELD NOTES',sub:'Reading Expedition',zh:'探險閱讀筆記',icon:'✎',badge:'READING BADGE',path:'../第二關_閱讀填空/index.html'},{id:'g',title:'SAFARI RANGER MISSION',sub:'Grammar Survival Challenge',zh:'巡護員句型任務',icon:'⌖',badge:'GRAMMAR RANGER BADGE',path:'../第三關_句型任務/index.html'}];let selected=null,placed={};const done=id=>localStorage.getItem(KEYS[id])==='1';const earned=()=>missions.filter(x=>done(x.id));const say=t=>{const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>e.classList.remove('show'),1600)};function init(){if(!localStorage.getItem(KEYS.start))localStorage.setItem(KEYS.start,String(Date.now()));render()}function render(){const badges=earned();document.querySelector('#count').textContent=`${badges.length} / 3 Badges`;document.querySelector('#gateCount').textContent=`BADGES COLLECTED: ${badges.length} / 3`;document.querySelector('#miniSlots').innerHTML=missions.map(m=>`<div class="mini-badge ${done(m.id)?'earned':''}">${m.id==='v'?'VOCABULARY':m.id==='r'?'READING':'GRAMMAR'}</div>`).join('');document.querySelector('#stops').innerHTML=missions.map((m,i)=>{const unlocked=i===0||done(missions[i-1].id);return `<article class="landmark ${done(m.id)?'completed':''} ${unlocked?'':'locked'}"><div class="icon">${m.icon}</div><h3>${m.title}</h3><p>${m.sub}</p><p class="zh">${m.zh}</p><span class="status">MISSION ${i+1}<br>${done(m.id)?'Completed ✓':'Not Completed'}</span>${done(m.id)?'<span class="stamp">SAFARI<br>STAMP</span>':''}<br><button class="button" data-go="${m.id}">${unlocked?'ENTER MISSION':'VIEW ROUTE'}</button></article>`}).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}function go(id){const i=missions.findIndex(m=>m.id===id);if(i&& !done(missions[i-1].id)){say('Complete the previous mission first!');return}location.href=missions[i].path}function show(content,cls=''){const m=document.querySelector('#modal');m.className=`modal ${cls}`;m.innerHTML=content}function close(){document.querySelector('#modal').className='modal hidden';selected=null;placed={}}function openGate(){const badges=earned();show(`<div class="modal-card"><h2>FINAL EXPEDITION GATE</h2><p>Place the badges you have collected into the matching expedition slots.</p><div class="slot-row">${missions.map(m=>`<div class="gate-slot" data-slot="${m.id}">${placed[m.id]?m.badge:m.id==='v'?'VOCABULARY SLOT':m.id==='r'?'READING SLOT':'GRAMMAR SLOT'}</div>`).join('')}</div><h3>EXPLORER BACKPACK</h3><div class="backpack">${badges.length?badges.map(m=>`<button class="badge ${selected===m.id?'selected':''} ${placed[m.id]?'placed':''}" data-badge="${m.id}" ${placed[m.id]?'disabled':''}>${m.badge}</button>`).join(''):'<p>More missions await!</p>'}</div><p>${badges.length<3?'More missions await!':''}</p><div class="modal-actions"><button class="button paper" id="return">RETURN TO MAP</button></div></div>`);document.querySelector('#return').onclick=close;bindGate();}function bindGate(){document.querySelectorAll('[data-badge]').forEach(b=>{b.onclick=()=>{selected=b.dataset.badge;openGate()};b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.badge);b.onpointerdown=pointerDrag});document.querySelectorAll('[data-slot]').forEach(s=>{s.onclick=()=>placeBadge(selected,s.dataset.slot);s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();placeBadge(e.dataTransfer.getData('text/plain'),s.dataset.slot)}})}function placeBadge(id,slot){if(!id||placed[id])return;if(id!==slot){const s=document.querySelector(`[data-slot="${slot}"]`);s.classList.add('wrong');setTimeout(()=>s.classList.remove('wrong'),500);selected=null;say('Check the badge label and try again.');return}placed[id]=true;selected=null;openGate();if(missions.every(m=>placed[m.id]))setTimeout(openComplete,600)}function pointerDrag(e){if(e.pointerType==='mouse')return;const id=e.currentTarget.dataset.badge,startX=e.clientX,startY=e.clientY;let moved=false;const move=x=>{if(Math.hypot(x.clientX-startX,x.clientY-startY)>10)moved=true};const up=x=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);if(moved){const slot=document.elementFromPoint(x.clientX,x.clientY)?.closest('[data-slot]');if(slot)placeBadge(id,slot.dataset.slot)}};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up,{once:true})}function openComplete(){localStorage.setItem(KEYS.gate,'1');const elapsed=Math.max(0,Date.now()-Number(localStorage.getItem(KEYS.start)));const mins=Math.floor(elapsed/60000),secs=Math.floor(elapsed/1000)%60;show(`<div class="modal-card"><h2>EXPEDITION COMPLETE!</h2><p>You completed the Safari English Expedition.</p><p>恭喜完成沙漠大草原英語探險！</p><div class="complete-badges">${missions.map(m=>`<div class="badge">${m.badge}<br>COMPLETED</div>`).join('')}</div><div class="time">TOTAL EXPEDITION TIME<br>${mins} min ${String(secs).padStart(2,'0')} sec</div><div class="modal-actions"><button class="button" id="new">START A NEW EXPEDITION<br>再次冒險</button><button class="button paper" id="back">RETURN TO MAP</button></div></div>`,'complete');document.querySelector('#new').onclick=clearAll;document.querySelector('#back').onclick=close}function confirmClear(){show(`<div class="modal-card"><h2>CLEAR PROGRESS?</h2><p>Clear all Safari Expedition progress?</p><div class="modal-actions"><button class="button paper" id="cancel">CANCEL</button><button class="button" id="clear">CLEAR</button></div></div>`);document.querySelector('#cancel').onclick=close;document.querySelector('#clear').onclick=clearAll}function clearAll(){Object.values(KEYS).forEach(k=>localStorage.removeItem(k));sessionStorage.removeItem('safariExpedition.map');location.reload()}document.querySelector('#gate').onclick=openGate;document.querySelector('#clearProgress').onclick=confirmClear;init();
</script><script>
document.addEventListener('click',event=>{const landmark=event.target.closest('.landmark');if(!landmark)return;const list=[...document.querySelectorAll('.landmark')],index=list.indexOf(landmark);if(index>=0)go(missions[index].id)});
</script><script>
/* Bilingual, ordinary-class-first UI copy. No map layout or storage logic is changed. */
const zhMission=[['草原詞彙獵蹤','單字探險'],['探險閱讀筆記','閱讀探險'],['巡護員句型任務','句型生存挑戰']];
function localizeMap(){document.querySelector('.passport h2').innerHTML='EXPEDITION PROGRESS<br><span>探險進度</span>';document.querySelector('#clearProgress').innerHTML='清除進度<br><small>CLEAR PROGRESS</small>';const n=earned().length;document.querySelector('#count').textContent=`已取得 ${n} / 3 枚徽章`;document.querySelectorAll('.mini-badge').forEach((b,i)=>b.innerHTML=[`VOCABULARY<br><strong>單字</strong>`,`READING<br><strong>閱讀</strong>`,`GRAMMAR<br><strong>句型</strong>`][i]);document.querySelectorAll('.landmark').forEach((landmark,i)=>{const [zh,type]=zhMission[i],complete=done(missions[i].id);landmark.querySelector('h3').innerHTML=`${missions[i].title}<br><span class="zh-title">${zh}</span>`;landmark.querySelector('p:not(.zh)').innerHTML=`${type}<br><small>${missions[i].sub}</small>`;landmark.querySelector('.zh').style.display='none';landmark.querySelector('.status').innerHTML=`MISSION ${i+1}｜第${i+1}關<br>${complete?'已完成 ✓':'尚未完成'}`});document.querySelector('#gate h2').innerHTML='FINAL EXPEDITION GATE<br><span>最終探險大門</span>';document.querySelector('#gateCount').innerHTML=`已取得徽章：${n} / 3<br><small>BADGES COLLECTED</small>`}
const originalGo=go;window.go=function(id){const i=missions.findIndex(m=>m.id===id);if(i&&!done(missions[i-1].id)){say('請先完成前一個任務！\nComplete the previous mission first.');return}location.href=missions[i].path};
const originalOpenGate=openGate;window.openGate=function(){originalOpenGate();document.querySelector('.modal-card h2').innerHTML='FINAL EXPEDITION GATE<br><span class="zh-modal">最終探險大門</span>';const text=document.querySelector('.modal-card>p');if(text)text.innerHTML='請將已取得的徽章放入正確凹槽。<br><small>Place your collected badges into the matching slots.</small>';const pack=document.querySelector('.modal-card h3');if(pack)pack.innerHTML='EXPLORER BACKPACK<br><span class="zh-modal">探險者背包</span>';const back=document.querySelector('#return');if(back)back.innerHTML='回到地圖<br><small>RETURN TO MAP</small>';document.querySelectorAll('.gate-slot').forEach((slot,i)=>{if(!placed[missions[i].id])slot.innerHTML=[`VOCABULARY<br><small>單字凹槽</small>`,`READING<br><small>閱讀凹槽</small>`,`GRAMMAR<br><small>句型凹槽</small>`][i]})};document.querySelector('#gate').onclick=window.openGate;localizeMap();document.querySelectorAll('.landmark.locked .status').forEach(status=>status.innerHTML='LOCKED<br>尚未解鎖');
</script><script>
const mapFrame=document.querySelector('.route');const mapImage=document.createElement('img');mapImage.src='map-bg.png';mapImage.alt='Safari Adventure Map';mapImage.className='map-bg';mapFrame.prepend(mapImage);
</script><script>
const COVER_KEY='safariExpedition.coverSeen';function showCover(){if(sessionStorage.getItem(COVER_KEY))return;const cover=document.createElement('button');cover.id='coverIntro';cover.type='button';cover.setAttribute('aria-label','點擊開始 Safari 英語探險');cover.innerHTML='<img src="cover.png" alt="Safari Expedition: The Three Badges — 點擊任何部位遊戲開始">';cover.onclick=()=>{sessionStorage.setItem(COVER_KEY,'1');cover.classList.add('fade-out');setTimeout(()=>cover.remove(),700)};document.body.append(cover)}const safariClearAll=clearAll;window.clearAll=function(){localStorage.clear();sessionStorage.clear();location.reload()};showCover();
</script><script>
const endingScenes=['assets/images/ending/ending-01.png','assets/images/ending/ending-02.png','assets/images/ending/ending-03.png','assets/images/ending/ending-04.png','assets/images/ending/ending-05.png'];
function playEnding(scene=0){show(`<div class="ending-player"><button id="endingNext" type="button" aria-label="下一張結局圖片"><img src="${endingScenes[scene]}" alt="Safari English Expedition 結局劇情 ${scene+1}，共 5 張"></button><div class="ending-controls"><span>ENDING STORY ${scene+1} / 5<br><small>動物睡眠探險紀錄</small></span><button class="button" id="endingButton" type="button">${scene<4?'下一張故事｜NEXT':'查看探險結算｜RESULTS'}</button></div></div>`,'ending-modal');const advance=()=>scene<4?playEnding(scene+1):showFinalResult();document.querySelector('#endingNext').onclick=advance;document.querySelector('#endingButton').onclick=advance}
function showFinalResult(){const elapsed=Math.max(0,Date.now()-Number(localStorage.getItem(KEYS.start)));const mins=Math.floor(elapsed/60000),secs=Math.floor(elapsed/1000)%60;show(`<div class="modal-card final-result"><h2>EXPEDITION COMPLETE!<br><span>探險完成！</span></h2><p>You completed the Safari English Expedition.<br>你已完成沙漠大草原英語探險。</p><div class="complete-badges">${missions.map(m=>`<div class="badge">${m.badge}<br>COMPLETED</div>`).join('')}</div><div class="time">TOTAL EXPEDITION TIME<br>總探險時間：${mins} min ${String(secs).padStart(2,'0')} sec</div><div class="modal-actions"><button class="button" id="new" type="button">再次冒險<br><small>START A NEW EXPEDITION</small></button><button class="button paper" id="back" type="button">回到地圖<br><small>RETURN TO MAP</small></button></div></div>`,'complete');document.querySelector('#new').onclick=clearAll;document.querySelector('#back').onclick=close}
